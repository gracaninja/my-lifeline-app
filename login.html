<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lifeline - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <div class="container">
        <h1>My Lifeline</h1>
        <p>A tool for introspection about your life journey and what comes next.</p>
        
        <div class="auth-container">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="signup">Sign Up</button>
            </div>
            
            <div class="auth-content">
                <div id="login-form" class="auth-form active">
                    <h2>Login to Your Account</h2>
                    <div class="form-group">
                        <label for="login-username">Username:</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password:</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button id="login-btn" type="button">Login</button>
                    <div id="login-error" class="error-message"></div>
                </div>
                
                <div id="signup-form" class="auth-form">
                    <h2>Create a New Account</h2>
                    <div class="form-group">
                        <label for="signup-username">Username:</label>
                        <input type="text" id="signup-username" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password:</label>
                        <input type="password" id="signup-password" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Confirm Password:</label>
                        <input type="password" id="signup-confirm-password" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-birthdate">Birth Date:</label>
                        <input type="date" id="signup-birthdate" required>
                    </div>
                    <button id="signup-btn" type="button">Sign Up</button>
                    <div id="signup-error" class="error-message"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
